        Sushen Sarkar is a seasoned data analytics and technology leader with extensive experience driving data-informed decision-making across large-scale, customer-focused and operational environments. Currently serving as a Manager of Data Analytics, he specializes in transforming complex business challenges into actionable insights through exploratory analysis, data visualization, and strategic storytelling. His work is centered on enhancing customer experience, improving operational efficiency, and strengthening data governance across enterprise systems.
        Throughout his career, Sushen has demonstrated a strong ability to bridge the gap between business strategy and technical execution. He has led analytics initiatives supporting contact operations and store performance, translating business objectives into measurable insights and executive-level narratives. His expertise spans metrics design, data quality improvement, and the development of intuitive dashboards that enable organizations to make informed, timely decisions. He is also known for resolving complex data discrepancies and establishing robust validation frameworks that enhance reporting accuracy and trust.
        In addition to his analytics leadership, Sushen brings deep experience in product development and engineering transformation. He has played a pivotal role in modernizing logistics and operational platforms, guiding transitions toward scalable architectures and user-centric solutions. His leadership has supported cross-functional collaboration across engineering, product, and operations teams, fostering innovation while improving workflows and system performance. He has also contributed to automation initiatives that streamline processes and enable more efficient resource utilization.
        Sushen’s professional journey reflects a consistent focus on building high-performing teams and nurturing talent. He is recognized for his collaborative leadership style, commitment to operational excellence, and ability to drive meaningful organizational change. Complementing his industry experience, he holds an advanced business degree, further strengthening his strategic perspective and ability to align analytics with broader business goals.

- day: "Sunday, November 22"
  time: "5:00pm–5:30pm"
  tz: "IST"
  title: "Stop Building AI Demos: How to Ship LLM Features People Actually Trust"
  outline: |-
    LLM demos are easy. Production AI is where things get weird.

    In this talk, I’ll walk through what actually changes when you move from a clever prototype to an AI feature real people depend on: messy prompts, unclear user intent, unreliable outputs, security constraints, evaluation gaps, and the painful moment when demo accuracy collapses in the wild.

    Using real-world lessons from building internal AI assistants, natural-language data tools, and enterprise AI workflows, we’ll cover how developers can design AI systems that are useful, testable, and trusted. We’ll look at practical patterns for scoping use cases, setting confidence boundaries, keeping humans in the loop, and measuring whether the AI is actually helping.

    Attendees will leave with a simple framework for deciding when an LLM belongs in a workflow, when it doesn’t, and how to avoid shipping an impressive toy that nobody trusts.
  track: "Manager/Culture"
  speakers:
    - name: "Vin Mitty, PhD"
      image: vin-mitty-phd.png
      position: "Sr. Director of Data Science & AI"
      company: "LegalShield (PPLSI)"
      bio: |-
        Vin Mitty is a data and AI leader with a PhD in the field, researcher, and author of the book, The AI Decision Map.

        Drawing from 2 decades of technology leadership, PhD research, and executive interviews on his podcast, Mitty helps organizations and leaders transform AI into measurable business outcomes.

- day: "Sunday, November 22"
  time: "5:30pm–6:00pm"
  tz: "IST"
  title: "Stop Repeating Yourself: Building a Pooled Audit Program That Regulators and Customers Both Trust"
  outline: |-
    Financial services customers operating under DORA, APRA CPS 230 and 234, and NYDFS 500 are required to audit their critical outsourced technology providers. For years the only answer was a one-to-one model: each customer scheduling a separate engagement, reviewing the same controls, asking many of the same questions. The resource drain compounds on both sides.

    This session walks through what it takes to build a pooled audit program: one structured multi-day session, multiple regulated customers assessing the same control environment simultaneously. We cover how to get regulators to accept it, what control domains matter most across different frameworks, how peer-to-peer customer learning emerges as an unplanned benefit, and what separates a program that satisfies a regulator from one that merely informs them.The audience leaves with a replicable framework for designing, piloting, and scaling a pooled audit model, grounded in hard-learned lessons from practitioners who have run this across multiple regulatory regimes and customer bases.

    No vendor pitch. Practitioner-tested.
  track: "Manager/Culture"
  speakers:
    - name: "Tushar Badlani"
      image: tushar-badlani.jpg
      position: "Security Specialist"
      company: "Figma"
      bio: |-
        Tushar Badlani is a Security Specialist at Figma, focused on scaling Customer Trust and Third-Party Risk Management programs. With 10+ years of experience building and scaling security programs across vendor assurance, customer assurance, customer trust, and security compliance, he specializes in building risk-first assurance frameworks that grow with the business.

        His career spans consulting at EY and TCS, where he developed a cross-industry foundation in GRC, IT audit, and compliance, and most recently 6.5 years at Okta, first as Customer Assurance NAM Manager overseeing customer assurance across North America, and then as Global Customer Audit Manager leading the company's global customer audit program across AMER, EMEA, and APJ.

        As a strategic Advisor at Drata, Tushar advises the leadership team on GRC, assurance, and compliance program design. He has also served on Customer Advisory Boards and Product Advisory Boards, bringing a practitioner's lens to product strategy that reflects real-world security and compliance needs.
        He is passionate about operationalizing security at scale, leveraging automation, framework harmonization, and cross-functional collaboration to make trust a competitive advantage.

- day: "Sunday, November 22"
  time: "6:00pm–6:30pm"
  tz: "IST"
  title: "HCMM ¦ Beyond Compliance: Why Most Cybersecurity Programs Still Fail in the Real World"
  outline: |-
    Organizations today are overwhelmed by cybersecurity frameworks, audits, scorecards, compliance requirements, and vendor promises — yet many still struggle to answer fundamental operational questions:

    - Where are we actually vulnerable?
    - Which weaknesses matter most?
    - What should we improve first?
    - How do we measure real progress?
    - And how resilient are we beyond compliance checklists?

    Frameworks such as ISO 27001, NIST CSF, CIS Controls, Zero Trust architectures, and various maturity assessments provide valuable guidance. However, in real-world environments, many organizations still face a dangerous gap between documented compliance and actual operational cyber resilience.

    This session introduces the Helvetic Cybersecurity Maturity Model (HCMM), a practical and structured approach designed to help organizations assess, visualize, prioritize, and improve cybersecurity maturity in a measurable and operationally meaningful way.

    Rather than introducing “yet another framework,” this talk focuses on the real-world challenges many organizations face today:

    - security programs driven by compliance instead of resilience
    - fragmented tooling without strategic visibility
    - unclear prioritization of investments
    - leadership blind spots
    - and the growing disconnect between technical controls and business risk

    The session explores how maturity-based approaches can help organizations:

    - identify operational weaknesses
    - improve governance visibility
    - prioritize security initiatives
    - align cybersecurity with business objectives
    - and build realistic improvement roadmaps instead of checkbox-driven activities

    Attendees will gain practical insights into:

    - where traditional cybersecurity maturity initiatives often fail
    - why compliance alone is not enough
    - how organizations can evaluate cyber resilience more realistically
    - and how structured maturity models can support better operational and strategic decision-making

    The presentation includes practical examples, governance considerations, operational perspectives, and lessons learned from complex transformation and cybersecurity environments.

    Participants will leave with:

    - a clearer understanding of the gap between compliance and resilience
    - practical ideas for evaluating cybersecurity maturity
    - approaches for prioritizing security improvements
    - and actionable concepts for building measurable cyber resilience programs
  track: "Manager/Culture"
  speakers:
    - name: "Dr. S. Isele"
      image: dr-s-isele.png
      position: "President and Agilist"
      company: "HelveticMinds - SwissShore LLC"
      bio: |-

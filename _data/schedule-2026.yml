  title: "Agentic Analytics: Trusted Human-AI Decision Intelligence at Scale"
  outline: |-
    Organizations increasingly rely on AI to accelerate operational decision-making, yet many struggle to balance speed, trust, governance, and human oversight. As operational data volumes grow across enterprise platforms, customer systems, and digital ecosystems, analytics teams face mounting challenges in extracting reliable insights while maintaining accountability for business decisions.

    This presentation introduces agentic analytics, an emerging approach in which AI agents actively participate in analytical workflows by exploring datasets, identifying anomalies, generating summaries, and supporting decision intelligence under human supervision. Rather than replacing analysts, agentic systems augment human expertise by reducing manual effort associated with data extraction, exploratory analysis, reporting, and insight generation.

    The session presents a practical framework for implementing agentic analytics through the integration of an enterprise data layer, analytics model layer, and AI agent layer. Attendees will learn how operational data is transformed into analytical outputs and decision-support narratives through structured human-AI collaboration.

    A key focus of the discussion is the governance and risk considerations associated with AI-assisted analytics. The presentation examines validation of AI-generated insights, transparency of analytical reasoning, data governance requirements, and the operational risks of automation bias. It also explores how organizations can establish guardrails that preserve human accountability while benefiting from AI-driven analytical efficiency.

    Attendees will leave with a clear understanding of the architectural components, governance practices, and implementation considerations required to deploy agentic analytics responsibly. The session is intended for security leaders, architects, operations teams, and technology practitioners seeking practical approaches for leveraging AI agents to improve decision intelligence while maintaining trust, oversight, and organizational control.

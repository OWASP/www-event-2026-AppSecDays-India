- day: "Saturday, November 21"
  time: "3:30pm–4:00pm"
  tz: "IST"
  title: "Deterministic Security for LLM-Powered Data Agents: Enforcing Row-Level Access Before the Context Wi"
  outline: |-
    LLM-powered analytics agents that query enterprise data stores are entering production. They answer business questions by coordinating queries across knowledge graphs, vector stores, metrics databases, and warehouses simultaneously. The security challenge is specific: these agents are probabilistic systems accessing sensitive data, and once data enters the LLM context window, you cannot guarantee it will not surface in the response. Instructing the model to "not reveal sensitive data" is not a security control.

    This talk presents a production architecture for enforcing deterministic, row-level security at the data layer before data ever reaches the LLM. Security is treated as a structural gate on the input, not a guardrail on the output. If the user lacks access to EMEA data, the graph query returns no EMEA nodes, the vector search excludes EMEA documents, and the metrics lookup filters EMEA figures. The LLM cannot leak what it never received.

    I will cover: how to enforce consistent access policies across heterogeneous stores with different permission models (graph, vector, relational) when a single query fans out across all of them in parallel; why prompt-based output filtering fails as a security
      mechanism; how to build auditable access trails when an AI agent, not a human, is executing the queries; and common implementation mistakes (caching without permission context, protecting the warehouse but not the vector store, creating an unprotected exfiltration path through the least-secured store).

    Attendees will leave with a concrete architectural pattern for securing LLM data agents, a pre-deployment checklist, and practical guidance on extending existing row-level security infrastructure to cover agentic access patterns.

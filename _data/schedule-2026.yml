- day: "Sunday, November 22"
  time: "1:00pm–1:30pm"
  tz: "IST"
  title: "Secure Governance for AI-Generated Code in Regulated Financial Systems"
  outline: |-
    Generative AI is rapidly changing software development by accelerating code generation, automated testing, code review, and operational workflows. While these capabilities improve developer productivity, they also introduce application security and governance risks that regulated financial institutions must address before AI-generated code can be trusted in production.

    This session examines two security challenges that emerge in AI-assisted software delivery. The first is correlated failure, where AI-generated application code and AI-generated test cases inherit the same incorrect assumptions, allowing vulnerabilities and logic flaws to bypass validation. The second is AI hallucination, where generated code appears technically correct but violates secure coding practices, financial business rules, or regulatory requirements, creating security, compliance, and operational risks.

    The session presents a practical governance framework aligned with the NIST AI Risk Management Framework (AI RMF 1.0), Basel Committee Operational Resilience Principles, and EBA ICT Risk Management Guidelines. Attendees will learn how to integrate human review, security validation, and risk-based approval into AI-assisted development pipelines without slowing software delivery. The framework evaluates software according to business impact and security risk rather than whether it was authored by a developer or generated by AI.

    The session also explores how governance must evolve as AI systems begin generating patches, diagnosing production incidents, and orchestrating infrastructure, raising new questions around accountability, security oversight, and regulatory compliance.

    Attendees will leave with practical guidance for implementing secure governance controls, strengthening AI-assisted SDLC practices, and adopting AI-generated code while maintaining application security, operational resilience, and regulatory compliance.

- day: "Saturday, November 21"
  time: "6:30pm–7:00pm"
  tz: "IST"
  title: "Beyond Copilot: AppSec Guardrails for AI-Generated Frontend Code"
  outline: |-
    AI coding assistants can help developers build user interfaces quickly, but the code they generate should not be treated as production-ready by default. A generated form, dashboard, or workflow may look correct in a demo while still creating security risks such as unsafe HTML rendering, missing validation, unnecessary dependencies, exposed configuration, or client-side trust assumptions.

    This introductory talk explains how developers and AppSec teams can review AI-generated frontend code using simple, practical guardrails. The session will walk through common risk patterns, what to look for during review, and how teams can use approved components, basic static checks, dependency review, browser tests, and CI gates to catch problems earlier.

    The goal is not to avoid AI coding tools. The goal is to use them safely by treating their output as a draft that still needs engineering review, automated checks, and clear security boundaries.

    Attendees will leave with a beginner-friendly checklist they can use when reviewing AI-generated frontend code.

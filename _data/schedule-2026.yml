- day: "Sunday, November 22"
  time: "1:30pm–2:00pm"
  tz: "IST"
  title: "Secure RAG Architecture for Financial Institutions: Provenance and Policy Enforcement"
  outline: |-
    Retrieval-Augmented Generation has become the dominant approach for deploying enterprise generative AI, enabling large language models to produce responses grounded in organizational knowledge without embedding sensitive data into model weights. In regulated financial environments, however, RAG pipelines introduce serious application security risks including sensitive information disclosure, entitlement bypass, provenance ambiguity, and inconsistent policy enforcement across ingestion, indexing, retrieval, and generation stages.
    This session presents a Secure RAG reference architecture designed specifically for banking and financial institutions operating under strict compliance and data governance mandates. The framework addresses three foundational security objectives: preventing data leakage, ensuring verifiable provenance, and enabling enforceable policy controls throughout the AI lifecycle.
    The architecture integrates identity- and attribute-aware retrieval mechanisms, policy-as-code enforcement using Attribute-Based Access Control, retrieval-scoped access filters, redaction gates for sensitive outputs, and immutable audit logging. To support audit defensibility, the framework introduces evidence bundles containing document identifiers, retrieval metadata, version history, timestamps, and policy decisions that can be produced on demand for compliance reviews.
    The session also maps major threat categories relevant to financial AI systems, including prompt injection, retrieval compromise, sensitive output generation, and supply chain risks, and demonstrates how each can be mitigated through the proposed controls. Attendees will also walk away with a practical evaluation methodology covering leakage prevention rates, entitlement enforcement accuracy, provenance fidelity, refusal correctness, latency impact, and operational cost.

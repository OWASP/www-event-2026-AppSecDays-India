      company: "Socket"
      bio: |-
        Security researcher at Socket.dev. Securing Open Source Supply chain, for various fortune 500 customers like Netflix, Salesfore, etc. and other leading AI companies like Anthropic, OpenAI and many more.

- day: "Saturday, November 21"
  time: "12:30pm–1:00pm"
  tz: "IST"
  title: "Backdoored Bounties: Attacking AI‑Powered Bug Bounty Pipelines"
  outline: |-
    AI‑assisted bug bounty has gone from niche experiment to mainstream workflow in less than a year. Open source toolchains like BugHunter, Claude‑BugBounty and autonomous “bug hunter AI” frameworks now orchestrate dozens of AI agents across recon, vuln discovery, validation and report drafting, wired directly into HackerOne/Bugcrowd scopes and real targets. But in many setups, these agents are treated as trusted copilots instead of high privilege software components with their own attack surface.

    This talk shows how to turn those AI‑powered pipelines against their operators.

    Using a lab composed of a popular AI bug bounty toolkit wired to a custom MCP (Model Context Protocol) server, the session demonstrates three backdoor patterns: exfiltrating secrets discovered during recon, silently downgrading or suppressing high impact findings before they reach the platform and steering autonomous hunting toward attacker chosen assets by poisoning skills, MCP tools and context.

    Rather than hand waving about “AI risk”, I walk through concrete exploit chains against realistic workflows: skill bundles that rewrite reports, malicious MCP tools that masquerade as helper utilities and poisoned configurations that abuse cross‑session memory and auto‑resume features. For each attack, I then show defensive patterns that AppSec and bounty teams can actually deploy today: scope‑aware MCP tooling, signed skill/tool descriptors, validation gates on AI‑generated findings and explicit separation of duties between human and agent.

    Attendees will leave with a clear model of where the real security boundaries are in AI‑powered bug bounty stacks and a practical checklist for hardening their own pipelines before an attacker files the first “backdoored bounty”.

- day: "Saturday, November 21"
  time: "4:00pm–4:30pm"
  tz: "IST"
  title: "When AI Agents Go Wrong: Building Production-Ready Evaluation and Security Guardrails"
  outline: |-
    AI agents are rapidly evolving from passive assistants to systems that can retrieve data, invoke tools, make decisions, and execute multi-step tasks with minimal human intervention. While these capabilities unlock significant business value, they also introduce new application security challenges that traditional security testing approaches were not designed to address.

    How do we determine whether an AI agent is safe to deploy? How do we evaluate whether it will behave securely when faced with prompt injection attacks, unauthorized tool usage, sensitive data access, or failures in multi-step reasoning?

    This session explores practical approaches for building production-ready evaluation frameworks and security guardrails for Agentic AI systems. Attendees will learn how to move beyond traditional model accuracy metrics to evaluate security, reliability, and trustworthiness in AI-powered applications.

    Topics covered include threat modeling for Agentic AI applications, designing human approval workflows for high-risk actions, evaluating tool invocation and permission boundaries, implementing continuous monitoring strategies, and managing risk trade-offs between autonomy, usability, and security.

    Attendees will leave with actionable architectural patterns and implementation strategies that can be immediately applied when building or securing AI-powered applications in production environments.

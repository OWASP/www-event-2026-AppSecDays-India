  title: "AI Metadata Security for Scalable Financial Crime Detection"
  outline: |-
    Financial crime detection increasingly depends on secure, trusted, and explainable data flows across web, cloud, API, and analytics platforms. Yet many institutions still struggle with fragmented metadata, inconsistent lineage, weak validation controls, and limited visibility into how sensitive data is classified, transformed, and consumed across detection systems. This session presents an application security–focused framework for using AI-powered metadata management to improve data quality, resilience, and governance in cross-border financial crime monitoring.

    The talk will show how supervised learning, semantic classification, entity resolution, and API-first metadata services can be securely embedded into enterprise architectures to automate classification, enrichment, validation, and lineage tracking. It will also address key AppSec concerns, including privacy controls, secure API design, access governance, model explainability, adversarial testing, and auditability. Real-world implementation patterns demonstrate reductions in reconciliation effort, false positives, alert fatigue, and case resolution time while improving regulatory confidence.

    Attendees will learn practical design patterns for building secure metadata pipelines, integrating AI safely into financial crime platforms, and applying OWASP-aligned principles to data-intensive compliance systems. The session is relevant for builders, defenders, architects, and security leaders working to secure AI-enabled financial applications at scale.

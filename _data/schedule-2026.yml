    - name: "Steve Springett"
      image: steve-springett.png
      position: "Chair, OWASP CycloneDX"
      company: "OWASP Global Board of Directors"
      bio: >-
        Steve Springett is the Chair of OWASP CycloneDX, creator of OWASP Dependency-Track,
        founder and Chair of Ecma International TC54, coauthor of the OWASP Software Component
        Verification Standard (SCVS) and Package-URL, and a member of the OWASP Global Board of
        Directors. CycloneDX became an international standard (ECMA-424) in 2024 and is the SBOM
        format referenced by the EU Cyber Resilience Act. Steve advises security, engineering, and
        product leaders on software supply chain security, software transparency, and regulatory
        readiness. [LinkedIn](https://www.linkedin.com/in/stevespringett/)


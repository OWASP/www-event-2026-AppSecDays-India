- day: "Saturday, November 21"
  time: "1:00pm–1:30pm"
  tz: "IST"
  title: "Map, Click, Pwn: Automating Attack Chains with AI-Powered Mind Maps"
  outline: |-
    There are two kinds of security testers: the ones using AI, and the ones getting left behind. But the first group has a growing problem. Ask an AI whether testing is complete, and the answer is almost always “yes.” The real question is whether it actually exercised every agent skill, performed meaningful verification, and explored the important paths, or simply hallucinated confidence while missing critical issues.
    This talk introduces graph-based AI penetration testing, a practical alternative to opaque AI security automation. Instead of relying on black-box systems that declare success without evidence, we use visual mind maps to guide and track LLM execution in a transparent way. Every node represents a decision, a tool action, or a validation step that can be inspected, audited, and customized.

    In the live demo, we will build an attack plan in real time and show the AI executing each step while feeding real outputs directly into the graph. Rather than guessing whether a check actually ran, the mind map becomes a visible record of coverage and execution. We will also demonstrate how senior tester knowledge can be encoded into structured workflows, how specific agent skills can be invoked per node, and how flows can be adapted dynamically without retraining models.
    You will learn the architecture behind connecting mind maps to tool execution, techniques for runtime verification, and practical templates you can use immediately. Instead of trusting a black box that says “testing complete,” this approach enables AI-powered security testing that is transparent, auditable, and driven by real testing experience.

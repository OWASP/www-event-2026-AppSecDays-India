- day: "Saturday, November 21"
  time: "3:00pm–3:30pm"
  tz: "IST"
  title: "Prompt Injection Is an Access Control Problem: Least Privilege for AI Agents and MCP Servers"
  outline: |-
    Every AI agent deployment ships with the same silent flaw: the agent holds far more privilege than any single task needs. When a prompt injection lands, the payload matters less than the blast radius, and the blast radius was set by the permissions granted last quarter. Gartner projects that through 2029, more than half of successful attacks on AI agents will exploit access control via prompt injection. Treating injection as a model problem has failed. Treating it as an access control problem gives defenders tools that already work.

    This talk demonstrates five least-privilege patterns for agents and MCP servers, live against public reference MCP servers (filesystem, git, fetch, github):

    1. Per-task tool allowlists instead of per-agent grants
    2. Deny-by-default capability scoping at the MCP boundary
    3. Deterministic egress controls, so an injected instruction cannot exfiltrate what it can read
    4. Human-approval gates keyed to privilege tier, not blanket confirmation fatigue
    5. Deriving a least-privilege policy from an agent's observed behavior trace, then diffing every CI run against it to catch privilege drift

    Each pattern maps to the OWASP MCP Top 10 and Agentic Security Initiative guidance, and every demo is reproducible from a public repo.

    Attendees leave able to: inventory the real privilege surface of an agent they already run, write a deny-by-default policy for one MCP server the same week, and wire a drift check into CI so the policy stays honest. No product and no vendor pitch: everything shown is open source and runs on a laptop.

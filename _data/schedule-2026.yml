- day: "Sunday, November 22"
  time: "2:00pm–2:30pm"
  tz: "IST"
  title: "Secure Enterprise RAG Architectures: Building Trusted AI Knowledge Systems with Vector Search"
  outline: |-
    Generative AI is rapidly becoming part of enterprise applications, yet deploying Retrieval-Augmented Generation (RAG) securely remains a significant application security challenge. While vector databases and semantic retrieval improve knowledge discovery, they also introduce new attack surfaces, including prompt injection, data poisoning, retrieval manipulation, unauthorized information disclosure, and insecure AI pipelines. This presentation examines how to design secure enterprise RAG architectures that deliver trustworthy, context-aware responses while protecting sensitive organizational knowledge.

    The session explores practical architectural patterns for securing vectorized knowledge systems using embedding isolation, hybrid retrieval validation, secure vector indexing, identity-aware access controls, encrypted storage, and policy-driven governance. It demonstrates how retrieval validation, grounding verification, provenance tracking, and human oversight reduce hallucinations and strengthen AI reliability within production environments. Additional topics include protecting enterprise data during ingestion, securing AI-assisted applications across the software development lifecycle, implementing zero-trust principles for AI services, and monitoring retrieval pipelines for anomalous behavior. The presentation also discusses emerging techniques including agentic RAG, graph-enhanced retrieval, and runtime security controls that improve reasoning while maintaining application security.

    Attendees will leave with actionable architectural guidance for designing scalable, secure, and production-ready AI knowledge platforms that strengthen enterprise application security while enabling responsible adoption of generative AI.

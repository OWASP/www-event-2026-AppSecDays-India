- day: "Saturday, November 21"
  time: "5:00pm–5:30pm"
  tz: "IST"
  title: "Red Teaming Taxonomy for Voice and Audio AI Systems: From Text-Domain Transfer to Audio-Native Attack"
  outline: |-
    Voice-based agentic AI systems — assistants, customer-support agents, and autonomous voice agents that chain speech recognition, large language models, tool invocation, and speech synthesis — introduce attack surfaces that neither text-only LLM red-teaming taxonomies nor classical speech-security literature fully capture. Existing surveys of voice AI security largely treat voice as an additional input channel layered onto text-based threats, organizing attacks by a single axis (attack surface, or “nature of the attack”) inherited from LLM jailbreak literature. This conflates two populations of attacks with fundamentally different origins and properties, and leaves no systematic account of which text-domain attacks actually survive the transition into a spoken interface.

    This work introduces a taxonomy of voice AI red teaming built around an explicit top-level split between modality-transferred attacks — attacks whose mechanism is semantic or instructional and is agnostic to the channel carrying it — and modality-native attacks — attacks whose mechanism depends on properties of the acoustic channel itself (waveform, timing, speaker identity, transcription) and has no equivalent in a text-only system. Within each class, we classify individual attacks along four orthogonal axes: Attack Surface (where in the pipeline the attack targets), Adversarial Technique (how the attack operates), Attack Objective (why — including Availability as a first-class objective alongside Safety Bypass, Data Leakage, and Instruction Override), and Execution Context (the interaction pattern required).

    We validate this scheme empirically against 41 real attacks: 21 attacks drawn from our implemented text/LLM red-teaming framework — selected for coverage of the OWASP LLM Top 10 attack classes rather than as a random or exhaustive sample — and 20 additional attacks compiled from voice-specific security research. Applying a simple transferability criterion — whether an attack’s success mechanism survives a text-to-speech-to-text round trip, evaluated against [name engine(s), or: multiple commercial and open-source ASR/TTS pipelines to control for engine-specific transcription artifacts] — we find that 15 of the 21 text-domain attacks transfer to voice unmodified, while 6 do not. The non-transferring attacks share a common property we term literal-dependence: they depend on surviving as a literal rendering of text (an encoded string, an exact token sequence, a fixed adversarial suffix), and this dependence — not attack surface or objective — is what predicts transfer failure. Every persona-, dialogue-, or reasoning-based attack in our corpus survives transfer.

    Classifying the 20 audio-native attacks along the same four axes surfaces five clusters not visible under a single-axis taxonomy — transcription-boundary injection, speaker-identity confusion, signal-robustness attacks, conversational drift, and availability/denial-of-service — with availability attacks alone accounting for a quarter of the native corpus. Given the corpus size, we treat these as qualitative groupings rather than statistically validated clusters, and use them to motivate our decision to treat availability as a peer objective rather than a minor subcategory, departing from prior taxonomies. We also identify three attacks (context drift, tool-loop, memory-exhaustion) whose classification as native rather than transferred is genuinely ambiguous — these sit closer to agentic-orchestration failure modes than to the voice channel itself, and we position them explicitly against OWASP Agentic AI’s ASI attack classes — and use this ambiguity to refine the transferred/native boundary criterion.

    Finally, mapping our corpus against classical audio-native authentication attacks (replay attacks, voice cloning, ultrasonic/DolphinAttack-style injection) reveals a coverage gap: none of the 41 attacks in our corpus target voice authentication directly, despite this being a well-established audio-native threat class. We treat this gap as both a limitation of current voice red-teaming practice and a concrete direction for future benchmark development, alongside automated native-attack generation and standardized transfer-fragility evaluation metrics.

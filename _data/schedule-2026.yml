- day: "Saturday, November 21"
  time: "1:30pm–2:00pm"
  tz: "IST"
  title: "I Broke My Own Agent Firewall: Four Ways Past Tool-Call Policy"
  outline: |-
    I built a runtime filter for agent tool calls, felt pretty good about it, then spent a week trying to get past it. I got through four different ways in an afternoon. This is the attacker's side of that story - how the security controls people are bolting onto AI agents actually fail, and how to test your own before someone else does.

    The theme is simple: never trust the string an agent hands you. A filter that blocks a tool by name is trivially beaten if it compares raw text. I'll walk through four concrete bypasses, live where I can:

    - Look-alike names. Call "delete_record" with a Cyrillic character, or splice in a zero-width space. Identical in the logs, invisible to an exact-match blocklist.
    - Encoding. Wrap a SQL or shell payload in base64 (or nest it) so a scanner reading the raw parameters sees nothing dangerous.
    - Renaming. The blocklist says delete_record; I call purge_all. Name lists don't generalize to intent.
    - Cross-tenant via SQL. A schema-qualified query - SELECT ... FROM other_tenant.users - that never mentions the caller's own tenant.

    Then the part that makes it useful on Monday: a repeatable way to test an agent's tool-layer defenses instead of guessing, and the fix for each bypass (normalization, decode-then-scan, verb/intent matching, schema checks) so you can tell whether a control is real or theater.

    You'll leave with a checklist to break - or validate - any tool-call filter, and a clear reason exact-string matching is a security anti-pattern in agent systems.

  time: "6:00pm–6:30pm"
  tz: "IST"
  title: "The API Made Me Do It - Do Bad APIs Lead AI to Generate Vulnerable Code?"
  outline: |-
    We blame the bot when AI-generated code is vulnerable. But what if the bot is just using the dangerous toys we left on the table?

    This experiment tests whether bad APIs steer AI coding agents toward vulnerable code.

    The same agent builds the same project twice: once with free library selection and once with bans on risky APIs and safer replacements.

    The resulting projects are analyzed with SAST and manual review.

    Can a safer API surface turn a reckless bot into a security champion?

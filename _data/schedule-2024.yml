- day: "Thursday, November 14"
  time: "10:00am"
  tz: "IST"
  title: "Users - The Last Frontier"
  keynote: "Opening Keynote"
  speakers:
    - name: "Saumil Shah"
      image: saumil-shah.jpg
      position: "CEO"
      company: "Net-Square"
      bio: >-
        Saumil Shah is the founder and CEO of Net-Square, providing cutting edge information security services to clients around the globe. Saumil is an internationally recognized speaker and instructor, having regularly presented at conferences like 44CON, Blackhat, RSA, CanSecWest, PacSec, EUSecWest, Hack.lu, Hack-in-the-box and others. He has authored two books titled “Web Hacking: Attacks and Defense” and “The Anti-Virus Book”.
        Saumil graduated with an M.S. in Computer Science from Purdue University, USA and a B.E. in Computer Engineering from Gujarat University. He spends his leisure time breaking software, flying kites, traveling around the world and taking pictures.

